; Background container: queue worker(s) + scheduler loop. The app has no Horizon/Reverb;
; QUEUE_CONNECTION=database and schedule:work drives routes/console.php (ScheduledTaskRegistry, serp:run-task).
[supervisord]
nodaemon=true
; No `user=` drop here: production's USER app (Dockerfile) already runs the whole container
; non-root, so this would be a no-op there. On hosts where the container runs as root (see
; docker-compose.override.yml's Windows bind-mount note), supervisord dropping to app here while
; PID 1 stays root breaks stdout_logfile=/dev/stdout below (/dev/stdout -> PID 1's fd, root-owned,
; EACCES for app) and kills every child with "unknown error making dispatchers".
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisor/supervisord.pid

[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
numprocs=%(ENV_QUEUE_PROCS)s
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3600
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
