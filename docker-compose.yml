# Production-like stack:  docker compose -f docker-compose.yml up -d --build
# Dev: plain `docker compose up` also loads docker-compose.override.yml.
# All settings come from .env (cp .env.docker.example .env); compose reads the same file for ${VAR} interpolation.
name: eugemsms

x-app: &app
  image: eugemsms-app:${APP_TAG:-latest}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: production
  env_file: .env
  environment: &app-env
    APP_KEY: ${APP_KEY:?set APP_KEY in .env (php artisan key:generate --show)}
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-eugemsms}
    DB_USERNAME: ${DB_USERNAME:-eugemsms}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Drivers: switchable from .env only (defaults = database/local). See docs/DOCKER.md "Switching drivers".
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    CACHE_STORE: ${CACHE_STORE:-database}
    SESSION_DRIVER: ${SESSION_DRIVER:-database}
    FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
    BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
    REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    AWS_BUCKET: ${AWS_BUCKET:-}
    AWS_ENDPOINT: ${AWS_ENDPOINT:-}
    AWS_URL: ${AWS_URL:-}
    AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}   # only this service migrates
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000)?0:1);'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s

  web:
    image: eugemsms-web:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  # Queue worker(s) (QUEUE_CONNECTION=database) + `schedule:work` loop, under supervisord.
  # No Horizon/Reverb service: neither package is installed and nothing broadcasts.
  worker:
    <<: *app
    command: ["supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    environment:
      <<: *app-env
      QUEUE_PROCS: ${QUEUE_PROCS:-2}
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null && pgrep -f 'artisan schedule:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-eugemsms}
      MYSQL_USER: ${DB_USERNAME:-eugemsms}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Optional (enable with COMPOSE_PROFILES=redis,s3 or --profile) ----
  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # S3-compatible store for dev/self-host. Set AWS_ENDPOINT=http://minio:9000, AWS_USE_PATH_STYLE_ENDPOINT=true.
  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fs http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-setup:
    profiles: ["s3"]
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing \"local/$$AWS_BUCKET\""]

  # ---- Garage: self-hosted S3-compatible store for production (profile "garage"). See docs/DOCKER.md "Production file storage".
  # Internal network only: no published ports. For dev, optionally uncomment the ports line.
  garage:
    profiles: ["garage"]
    # TAG: v2.3.0 was the newest semver tag seen on Docker Hub (dxflrs/garage); image not pulled here. Owner must verify before deploy.
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN (openssl rand -base64 32)}
    # ports:
    #   - "127.0.0.1:3900:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  garage-setup:
    profiles: ["garage"]
    build:
      context: docker/garage
      dockerfile: Dockerfile.setup
    restart: "no"
    network_mode: "service:garage"
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN}
      GARAGE_BUCKET: ${AWS_BUCKET:?set AWS_BUCKET}
      GARAGE_KEY_NAME: ${GARAGE_KEY_NAME:-eugemsms}
      GARAGE_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID (GK + 24 hex chars)}
      GARAGE_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY (64 hex chars)}
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-10G}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - ./docker/garage/setup.sh:/setup.sh:ro
      - garagemeta:/var/lib/garage/meta
    entrypoint: ["/bin/sh", "/setup.sh"]

volumes:
  dbdata:
  storage:
  redisdata:
  miniodata:
  garagemeta:
  garagedata:
